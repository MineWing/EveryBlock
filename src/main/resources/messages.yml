reloaded:
  enabled: true
  actions:
    - '[message] %tag% <white>Configuration and messages reloaded. <#f7a48d>%total%</#f7a48d> blocks are in the challenge.</white>'
reload-failed:
  enabled: true
  actions:
    - '[message] %tag% <white>Reload failed. Check the console; existing progress is safe.</white>'
database-error:
  enabled: true
  actions:
    - '[message] %tag% <white>The progress database could not be updated. Staff have been notified.</white>'

# ---------------------------------------------------------------------------
# GUI text (/blocks and /items menus). Every title, button, and lore line the
# menus render is a raw MiniMessage string built from this section, so it
# reloads instantly with /blocks reload. %tag% and the usual placeholders
# (noted per key below) work here too.
# ---------------------------------------------------------------------------
gui:
  block-menu:
    # %page%, %pages%
    categories-title: '<#f7a48d><bold>BLOCKS</bold></#f7a48d> <dark_gray>•</dark_gray> <white>Categories</white>'
    recent-title: '<#f7a48d><bold>RECENT DISCOVERIES</bold></#f7a48d> <dark_gray>•</dark_gray> <gray>%page%/%pages%</gray>'
    # %block%
    recipe-title: '<#f7a48d><bold>RECIPE</bold></#f7a48d> <dark_gray>•</dark_gray> <white>%block%</white>'
    items-title: '<#f7a48d><bold>ITEMS</bold></#f7a48d> <dark_gray>•</dark_gray> <gray>%page%/%pages%</gray>'

  # Filled/empty colors for the ■■■□□ progress bars.
  progress-bar:
    filled: '#f7a48d'
    empty: 'dark_gray'

  buttons:
    recent-discoveries:
      name: '<#f7a48d><bold>Recent Discoveries</bold></#f7a48d>'
      lore:
        - '<gray>See what the team discovered most recently.</gray>'
        - ''
        - '<dark_gray>│</dark_gray> <#f7a48d>Left-click</#f7a48d> <gray>to open the collection history.</gray>'
    search-blocks:
      name: '<#f7a48d><bold>Search Blocks</bold></#f7a48d>'
      lore:
        - '<gray>Find a specific block in the challenge.</gray>'
        - ''
        - '<dark_gray>│</dark_gray> <gray>Use</gray> <white>/blocks search &lt;name&gt;</white>'
    close:
      name: '<red><bold>Close</bold></red>'
      lore:
        - '<dark_gray>│</dark_gray> <red>Left-click</red> <gray>to close this menu.</gray>'
    previous:
      # %page%
      name: '<#f7a48d><bold>Previous</bold></#f7a48d>'
      lore:
        - '<dark_gray>│</dark_gray> <#f7a48d>Left-click</#f7a48d> <gray>to view page %page%.</gray>'
    next:
      # %page%
      name: '<#f7a48d><bold>Next</bold></#f7a48d>'
      lore:
        - '<dark_gray>│</dark_gray> <#f7a48d>Left-click</#f7a48d> <gray>to view page %page%.</gray>'
    back-to-categories:
      name: '<#f7a48d><bold>Back to Categories</bold></#f7a48d>'
      recent-lore:
        - '<dark_gray>│</dark_gray> <#f7a48d>Left-click</#f7a48d> <gray>to return to the categories.</gray>'
      block-lore:
        - '<dark_gray>│</dark_gray> <#f7a48d>Left-click</#f7a48d> <gray>to choose another category.</gray>'
    team-progress:
      name: '<#f7a48d><bold>Team Progress</bold></#f7a48d>'
    item-progress:
      name: '<#f7a48d><bold>Item Progress</bold></#f7a48d>'
    view-filter:
      name: '<#f7a48d><bold>View Filter</bold></#f7a48d>'
      click-to-cycle: '<dark_gray>│</dark_gray> <yellow>Left-click</yellow> <gray>to cycle views.</gray>'
      # %label%
      active: '<green><bold>• %label%</bold></green>'
      inactive: '<dark_gray>• %label%</dark_gray>'

  filters:
    all: 'All'
    found: 'Found'
    missing: 'Missing'

  recent-menu:
    empty-name: '<gray><bold>No Discoveries Yet</bold></gray>'
    empty-lore:
      - '<gray>The team has not discovered anything yet.</gray>'
      - ''
      - '<dark_gray>│ Collected blocks will appear here.</dark_gray>'

  # The block/item collection items dropped into the menu grid.
  collectible:
    # %name% - only used for common/uncommon rarity, which have no gradient
    collected-name: '<green><bold>✔ %name%</bold></green>'
    missing-name: '<red><bold>✘ %name%</bold></red>'
    # Epic/legendary names keep their rarity gradient; only the check/cross prefix is styled here.
    collected-prefix: '<green><bold>✔</bold></green> '
    missing-prefix: '<red><bold>✘</bold></red> '
    # %rarity% - pre-styled rarity label from gui.rarities.*
    rarity-line: '<dark_gray>│</dark_gray> <gray>Rarity:</gray> %rarity%'
    collected-header: '<green><bold>✔ ᴄᴏʟʟᴇᴄᴛᴇᴅ</bold></green>'
    # %player%
    found-by: '<dark_gray>│</dark_gray> <gray>Found by:</gray> <#f7a48d>%player%</#f7a48d>'
    # %date%
    discovered: '<dark_gray>│</dark_gray> <gray>Discovered:</gray> <white>%date%</white>'
    not-collected-header: '<red><bold>✘ ɴᴏᴛ ʏᴇᴛ ᴄᴏʟʟᴇᴄᴛᴇᴅ</bold></red>'
    bring-block: '<dark_gray>│</dark_gray> <gray>Bring this block into your inventory.</gray>'
    bring-item: '<dark_gray>│</dark_gray> <gray>Bring this item into your inventory.</gray>'

  # Shared progress lines used by the team/item progress items and category tiles.
  progress:
    # %found%, %total%
    collected-line: '<dark_gray>│</dark_gray> <gray>Collected:</gray> <#f7a48d><bold>%found%</bold></#f7a48d><gray>/</gray><white>%total%</white>'
    # %percent%
    complete-line: '<dark_gray>│</dark_gray> <gray>Complete:</gray> <green>%percent%%</green>'
    # %remaining%
    remaining-line: '<dark_gray>│</dark_gray> <gray>Remaining:</gray> <yellow>%remaining%</yellow>'

  categories:
    # %name% / %description% wrap the per-category text below in a shared style.
    name-format: '<#f7a48d><bold>%name%</bold></#f7a48d>'
    description-format: '<white>%description%</white>'
    click-to-browse: '<dark_gray>│</dark_gray> <#f7a48d>Left-click</#f7a48d> <gray>to browse this category.</gray>'
    ALL:
      name: 'All Blocks'
      description: 'Every block in the challenge'
    TERRAIN:
      name: 'Terrain'
      description: 'Dirt, sand, ice and natural ground'
    ORES:
      name: 'Ores & Minerals'
      description: 'Ores, raw blocks and mineral blocks'
    PLANTS:
      name: 'Plants & Ocean'
      description: 'Plants, leaves, coral and aquatic blocks'
    WOOD:
      name: 'Wood Families'
      description: 'Logs, planks and wooden building pieces'
    STONE:
      name: 'Stone & Masonry'
      description: 'Stone, bricks and masonry families'
    COLOURED:
      name: 'Colours & Fabrics'
      description: 'Wool, concrete, terracotta and beds'
    GLASS_LIGHT:
      name: 'Glass & Lighting'
      description: 'Glass, lamps, lanterns and light sources'
    REDSTONE:
      name: 'Redstone'
      description: 'Components, rails and mechanisms'
    FUNCTIONAL:
      name: 'Utility & Storage'
      description: 'Workstations, storage and useful blocks'
    NETHER:
      name: 'The Nether'
      description: 'Blocks originating in the Nether'
    END:
      name: 'The End'
      description: 'Blocks originating in the End'
    MISC:
      name: 'Special & Misc'
      description: 'Unique blocks that belong nowhere else'

  # Label and color per rarity tier, used by the GUI and by %rarity% above.
  rarities:
    common:
      label: 'ᴄᴏᴍᴍᴏɴ'
      color: 'white'
    uncommon:
      label: 'ᴜɴᴄᴏᴍᴍᴏɴ'
      color: 'green'
    rare:
      label: 'ʀᴀʀᴇ'
      color: 'aqua'
    epic:
      label: 'ᴇᴘɪᴄ'
      color: 'gradient:#C084FC:#8B5CF6'
    legendary:
      label: 'ʟᴇɢᴇɴᴅᴀʀʏ'
      color: 'gradient:#FFF176:#FFD700:#FF8C00'
