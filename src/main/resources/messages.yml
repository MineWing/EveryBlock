gui-next-page:
  enabled: true
  actions:
    - '[sound] ITEM_BOOK_PAGE_TURN 0.7 1.15'
recipe-open:
  enabled: true
  actions:
    - '[sound] ITEM_BOOK_PAGE_TURN 0.7 1.0'
no-recipe:
  enabled: true
  actions:
    - '[message] %tag% %block% <white>cannot be crafted.</white>'
search-empty:
  enabled: true
  actions:
    - '[message] %tag% <white>No challenge blocks match <#f7a48d>%query%</#f7a48d>.</white>'
unknown-block:
  enabled: true
  actions:
    - '[message] %tag% <white>Unknown or excluded block <#f7a48d>%block%</#f7a48d>.</white>'
already-found:
  enabled: true
  actions:
    - '[message] %tag% %block% <white>was already found.</white>'
added:
  enabled: true
  actions:
    - '[message] %tag% <white>Added %block% <white>to the collected list.</white>'
removed:
  enabled: true
  actions:
    - '[message] %tag% <white>Removed %block% <white>from the collected list.</white>'
not-found:
  enabled: true
  actions:
    - '[message] %tag% %block% <white>has not been found yet.</white>'
reset-warning:
  enabled: true
  actions:
    - '[message] %tag% <red><bold>DANGER:</bold></red> <white>Use <#f7a48d>/blocks reset confirm</#f7a48d> to erase all challenge progress.</white>'
reset-complete:
  enabled: true
  actions:
    - '[broadcast] %tag% <white>%player% reset the Every Block challenge. Fresh start!</white>'
