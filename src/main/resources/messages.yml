# Every event is an enabled action list, matching Rivet and OneMillionCrops.
# Supported tags:
#   [message] <MiniMessage>
#   [broadcast] <MiniMessage>
#   [actionbar] <MiniMessage>
#   [title] <title> | <subtitle> | <fade-in> | <stay> | <fade-out>
#   [sound] <Bukkit sound> [volume] [pitch]
#   [particles] <particle> [count] [offset-x] [offset-y] [offset-z] [speed]
#   [firework] <#RRGGBB,#RRGGBB> | <type> | <power> | <count> | <gap ticks>
#   [bossbar] <text> | <seconds> | <color> | <overlay> | <progress>

tag: '<#f7a48d>BLOCKS</#f7a48d> <dark_gray>»</dark_gray>'

no-permission:
  enabled: true
  actions:
    - '[message] %tag% <white>You do not have permission to do that.</white>'
    - '[sound] ENTITY_VILLAGER_NO 0.7 1.0'
player-only:
  enabled: true
  actions:
    - '[message] %tag% <white>Only a player can open the block collection.</white>'
not-participant:
  enabled: true
  actions:
    - '[message] %tag% <white>You are not on this challenge''s participant list.</white>'

help:
  enabled: true
  actions:
    - '[message] <#f7a48d><bold>BLOCKS</bold></#f7a48d> <dark_gray>—</dark_gray> <white>shared collection challenge</white>'
    - '[message] <#f7a48d>/blocks</#f7a48d> <dark_gray>—</dark_gray> <white>open the collection GUI</white>'
    - '[message] <#f7a48d>/blocks status</#f7a48d> <dark_gray>—</dark_gray> <white>show team progress</white>'
    - '[message] <#f7a48d>/blocks search ‹block›</#f7a48d> <dark_gray>—</dark_gray> <white>search the collection</white>'
    - '[message] <#f7a48d>/blocks top</#f7a48d> <dark_gray>—</dark_gray> <white>show contribution leaders</white>'
admin-help:
  enabled: true
  actions:
    - '[message] <gray>Admin:</gray> <#f7a48d>/blocks add ‹block›</#f7a48d> <dark_gray>|</dark_gray> <#f7a48d>remove ‹block›</#f7a48d>'
    - '[message] <gray>Admin:</gray> <#f7a48d>/blocks reset confirm</#f7a48d> <dark_gray>|</dark_gray> <#f7a48d>reload</#f7a48d>'

status:
  enabled: true
  actions:
    - '[message] %tag% <white>Team progress: <#f7a48d><bold>%collected%/%total%</bold></#f7a48d> <gray>(%percent%%)</gray> <dark_gray>•</dark_gray> <white>%remaining% remaining</white>'
top-header:
  enabled: true
  actions:
    - '[message] <#f7a48d><bold>TOP BLOCK HUNTERS</bold></#f7a48d>'
top-row:
  enabled: true
  actions:
    - '[message] <dark_gray>%position%.</dark_gray> <white>%player%</white> <dark_gray>—</dark_gray> <#f7a48d>%amount%</#f7a48d>'
top-empty:
  enabled: true
  actions:
    - '[message] %tag% <white>No blocks have been discovered yet.</white>'

block-found:
  enabled: true
  actions:
    - '[broadcast] %tag% <white>%player% found </white>%block%<white>!</white> <dark_gray>(<gray>%collected%/%total%</gray>)</dark_gray>'
    - '[actionbar] <#f7a48d><bold>NEW BLOCK</bold></#f7a48d> <dark_gray>•</dark_gray> %block% <dark_gray>•</dark_gray> <white>%percent%%</white>'
block-found-epic:
  enabled: true
  actions:
    - '[broadcast] %tag% <gradient:#C084FC:#8B5CF6><bold>EPIC FIND!</bold></gradient> <white>%player% found </white>%block% <dark_gray>(<gray>%collected%/%total%</gray>)</dark_gray>'
    - '[actionbar] <gradient:#C084FC:#8B5CF6><bold>EPIC BLOCK</bold></gradient> <dark_gray>•</dark_gray> %block% <dark_gray>•</dark_gray> <white>%percent%%</white>'
block-found-legendary:
  enabled: true
  actions:
    - '[broadcast] %tag% <gradient:#FFF176:#FFD700:#FF8C00><bold>LEGENDARY FIND!</bold></gradient> <white>%player% found </white>%block% <dark_gray>(<gray>%collected%/%total%</gray>)</dark_gray>'
    - '[actionbar] <gradient:#FFF176:#FFD700:#FF8C00><bold>LEGENDARY BLOCK</bold></gradient> <dark_gray>•</dark_gray> %block% <dark_gray>•</dark_gray> <white>%percent%%</white>'
blocks-found:
  enabled: true
  actions:
    - '[broadcast] %tag% <white>%player% found <#f7a48d><bold>%amount% new blocks!</bold></#f7a48d> <dark_gray>(<gray>%collected%/%total%</gray>)</dark_gray>'
    - '[actionbar] <#f7a48d><bold>+%amount% NEW BLOCKS</bold></#f7a48d> <dark_gray>•</dark_gray> <white>%percent%% complete</white>'
blocks-found-row:
  enabled: true
  actions:
    - '[broadcast] <dark_gray>  •</dark_gray> %block%'

# For multi-block discoveries, only the highest rarity found is celebrated.
rarity-common:
  enabled: true
  actions:
    - '[sound] ENTITY_EXPERIENCE_ORB_PICKUP 0.65 1.35'
    - '[particles] HAPPY_VILLAGER 8 0.35 0.55 0.35 0.02'
rarity-uncommon:
  enabled: true
  actions:
    - '[sound] ENTITY_PLAYER_LEVELUP 0.75 1.45'
    - '[particles] WAX_ON 18 0.45 0.65 0.45 0.04'
rarity-rare:
  enabled: true
  actions:
    - '[title] <aqua><bold>RARE FIND</bold></aqua> | %block% | 5 | 35 | 10'
