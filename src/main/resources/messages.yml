items-reset:
  enabled: true
  actions:
    - '[broadcast] <#f7a48d>ITEMS</#f7a48d> <dark_gray>»</dark_gray> <white>%player% reset the Every Item challenge.</white>'

gui-open:
  enabled: true
  actions:
