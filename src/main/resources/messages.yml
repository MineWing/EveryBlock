rarity-legendary:
  enabled: true
  actions:
    - '[title] <gradient:#FFF176:#FFD700:#FF8C00><bold>LEGENDARY FIND</bold></gradient> | %block% | 8 | 65 | 15'
    - '[sound] UI_TOAST_CHALLENGE_COMPLETE 1.0 0.85'
    - '[sound] BLOCK_BEACON_ACTIVATE 1.0 1.0'
    - '[sound] ENTITY_PLAYER_LEVELUP 1.0 0.65'
    - '[particles] END_ROD 70 0.9 1.1 0.9 0.08'
    - '[firework] #FFD65A,#F7A48D,#FFFFFF | STAR | 1 | 3 | 8'
rarity-legendary-message:
  enabled: true
  actions:
    - '[broadcast] %tag% <gradient:#FFF176:#FFD700:#FF8C00><bold>LEGENDARY FIND!</bold></gradient> <white>%player% found </white>%block%'
milestone:
  enabled: true
  actions:
    - '[broadcast] %tag% <#f7a48d><bold>%percent%% COMPLETE!</bold></#f7a48d> <white>Only %remaining% blocks remain.</white>'
