complete-stats:
  enabled: true
  actions:
    - '[broadcast] <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</dark_gray>'
    - '[broadcast] <#f7a48d><bold>FINAL CHALLENGE STATS</bold></#f7a48d>'
    - '[broadcast] <gray>Combined playtime</gray> <dark_gray>»</dark_gray> <white>%playtime%</white>'
    - '[broadcast] <gray>Block hunters</gray> <dark_gray>»</dark_gray> <white>%contributors%</white>'
complete-contributor:
  enabled: true
  actions:
    - '[broadcast] <dark_gray>  •</dark_gray> <#f7a48d>%contributor%</#f7a48d> <dark_gray>(<gray>%amount% blocks</gray>)</dark_gray>'
complete-finale:
  enabled: true
  actions:
    - '[broadcast] <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</dark_gray>'
    - '[title] <#f7a48d><bold>EVERY BLOCK</bold></#f7a48d> | <white>Challenge complete!</white> | 10 | 100 | 20'
    - '[bossbar] <#f7a48d><bold>EVERY BLOCK COMPLETE</bold></#f7a48d> | 12 | PINK | PROGRESS | 1.0'
    - '[sound] UI_TOAST_CHALLENGE_COMPLETE 1.0 0.9'
    - '[firework] #F7A48D,#FFFFFF | STAR | 1 | 8 | 8'

items-disabled:
  enabled: true
  actions:
    - '[message] <#f7a48d>ITEMS</#f7a48d> <dark_gray>»</dark_gray> <white>The Every Item challenge is disabled. Set <#f7a48d>items.enabled</#f7a48d> to <green>true</green>.</white>'
items-status:
  enabled: true
  actions:
    - '[message] <#f7a48d>ITEMS</#f7a48d> <dark_gray>»</dark_gray> <white>Team progress: <#f7a48d><bold>%collected%/%total%</bold></#f7a48d> <gray>(%percent%%)</gray> <dark_gray>•</dark_gray> <white>%remaining% remaining</white>'
item-found:
  enabled: true
  actions:
    - '[broadcast] <#f7a48d>ITEMS</#f7a48d> <dark_gray>»</dark_gray> <white>%player% found </white>%item%<white>!</white> <dark_gray>(<gray>%collected%/%total%</gray>)</dark_gray>'
    - '[sound] ENTITY_ITEM_PICKUP 0.6 1.3'
items-found:
  enabled: true
  actions:
    - '[broadcast] <#f7a48d>ITEMS</#f7a48d> <dark_gray>»</dark_gray> <white>%player% found <#f7a48d><bold>%amount% new items!</bold></#f7a48d> <dark_gray>(<gray>%collected%/%total%</gray>)</dark_gray>'
    - '[sound] ENTITY_ITEM_PICKUP 0.7 1.45'
items-found-row:
