    - '[sound] UI_TOAST_GOAL_COMPLETE 0.9 1.1'
    - '[particles] TOTEM_OF_UNDYING 40 0.8 1.0 0.8 0.1'
    - '[firework] #F7A48D,#FFFFFF | BALL_LARGE | 1 | 2 | 8'
complete-start:
  enabled: true
  actions:
    - '[broadcast] <#f7a48d><bold>EVERY. SINGLE. BLOCK. COLLECTED.</bold></#f7a48d>'
    - '[title] <#f7a48d><bold>CHALLENGE COMPLETE</bold></#f7a48d> | <white>Every block. Absolute legends.</white> | 10 | 55 | 15'
    - '[sound] UI_TOAST_CHALLENGE_COMPLETE 1.0 1.0'
complete-final-block:
  enabled: true
  actions:
    - '[broadcast] %tag% <white>%player% found the final block: %block%</white>'
    - '[title] <white>FINAL BLOCK</white> | %block% | 8 | 45 | 12'
